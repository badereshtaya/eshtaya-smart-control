name: V2 Bootstrap

on:
  workflow_dispatch:
  push:
    branches:
      - v2.0.0-major-update
    paths:
      - '.github/workflows/v2-bootstrap.yml'
      - '.v2-bootstrap/**'
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  recover-v2:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v2.0.0-major-update
          fetch-depth: 0

      - name: Recover complete files from partial v2 overlay
        shell: bash
        run: |
          set -u
          mkdir -p /tmp/v2-recovered
          cat .v2-bootstrap/text_* | tr -d '\r\n ' | base64 --decode > /tmp/v2-text-overlay.tar.gz || true
          tar -xzf /tmp/v2-text-overlay.tar.gz -C /tmp/v2-recovered || true
          echo 'Recovered files:'
          find /tmp/v2-recovered -type f -printf '%P %s bytes\n' | sort
          tar -czf /tmp/v2-recovered-files.tar.gz -C /tmp/v2-recovered .

      - uses: actions/upload-artifact@v4
        with:
          name: v2-recovered-source
          path: /tmp/v2-recovered-files.tar.gz
          if-no-files-found: error
          retention-days: 2
