name: Bootstrap Eshtaya Smart Control source

on:
  push:
    paths:
      - source_payload.b64

permissions:
  contents: write

jobs:
  import-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Decode source package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/eshtaya-source"
          base64 --decode source_payload.b64 > "$RUNNER_TEMP/eshtaya-source.tar.gz"
          tar -xzf "$RUNNER_TEMP/eshtaya-source.tar.gz" -C "$RUNNER_TEMP/eshtaya-source"

      - name: Import complete repository
        shell: bash
        run: |
          set -euo pipefail
          cp -a "$RUNNER_TEMP/eshtaya-source/." ./
          rm -f source_payload.b64
          find . -type d -name '__pycache__' -prune -exec rm -rf {} +
          find . -type f -name '*.pyc' -delete

      - name: Commit imported source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Initial release: Eshtaya Smart Control v1.0.0"
          git push origin HEAD:main
