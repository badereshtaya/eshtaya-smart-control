name: Bootstrap Eshtaya Smart Control source

on:
  push:
    paths:
      - source_payload.ready
  pull_request:
    paths:
      - manual-trigger

permissions:
  contents: write

jobs:
  import-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref_name }}

      - name: Fetch legacy source modules
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/badereshtaya/hacs-eshtaya-multiway-control.git "$RUNNER_TEMP/multiway"
          git clone --depth 1 https://github.com/badereshtaya/hacs-eshtaya-entity-manager.git "$RUNNER_TEMP/entity-manager"

      - name: Build unified source tree
        shell: bash
        run: |
          set -euo pipefail
          TARGET="custom_components/eshtaya_smart_control"
          rm -rf "$TARGET/multiway" "$TARGET/brand" "$TARGET/frontend/multiway" "$TARGET/entity_control" "$TARGET/frontend/entity"
          mkdir -p "$TARGET" "$TARGET/frontend"

          cp -a "$RUNNER_TEMP/multiway/custom_components/eshtaya_multiway" "$TARGET/multiway"
          cp -a "$RUNNER_TEMP/multiway/custom_components/eshtaya_multiway/brand" "$TARGET/brand"
          mkdir -p "$TARGET/frontend/multiway"
          cp "$RUNNER_TEMP/multiway/custom_components/eshtaya_multiway/frontend/panel.js" "$TARGET/frontend/multiway/panel.js"
          rm -rf "$TARGET/multiway/brand" "$TARGET/multiway/frontend" "$TARGET/multiway/translations"
          rm -f "$TARGET/multiway/config_flow.py" "$TARGET/multiway/frontend.py" "$TARGET/multiway/manifest.json"

          mkdir -p "$TARGET/entity_control" "$TARGET/frontend/entity"
          cp "$RUNNER_TEMP/entity-manager/custom_components/eshtaya_entity_manager/manager.py" "$TARGET/entity_control/manager.py"
          cp "$RUNNER_TEMP/entity-manager/custom_components/eshtaya_entity_manager/manager_v11.py" "$TARGET/entity_control/manager_v11.py"
          cp "$RUNNER_TEMP/entity-manager/custom_components/eshtaya_entity_manager/manager_v12.py" "$TARGET/entity_control/manager_v12.py"
          cp "$RUNNER_TEMP/entity-manager/custom_components/eshtaya_entity_manager/frontend/eshtaya-entity-manager-panel.js" "$TARGET/frontend/entity/eshtaya-entity-manager-panel.js"
          cp "$RUNNER_TEMP/entity-manager/custom_components/eshtaya_entity_manager/frontend/eshtaya-entity-manager-panel-loader.js" "$TARGET/frontend/entity/eshtaya-entity-manager-panel-loader.js"

      - name: Adapt inherited frontends and WebSocket namespace
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re

          root = Path("custom_components/eshtaya_smart_control")

          ws = root / "multiway/websocket.py"
          text = ws.read_text(encoding="utf-8")
          text = re.sub(r'f"\{DOMAIN\}/(?!multiway/)', 'f"{DOMAIN}/multiway/', text)
          ws.write_text(text, encoding="utf-8")

          panel = root / "frontend/multiway/panel.js"
          text = panel.read_text(encoding="utf-8")
          text = text.replace('const DOMAIN = "eshtaya_multiway";', 'const DOMAIN = "eshtaya_smart_control/multiway";')
          text = text.replace('(this._hass?.language || this._hass?.locale?.language || "en")', '(window.__ESHTAYA_SMART_LANG__ || this._hass?.language || this._hass?.locale?.language || "en")')
          panel.write_text(text, encoding="utf-8")

          entity_panel = root / "frontend/entity/eshtaya-entity-manager-panel.js"
          text = entity_panel.read_text(encoding="utf-8")
          text = text.replace('const DOMAIN = "eshtaya_entity_manager";', 'const DOMAIN = "eshtaya_smart_control/entity";')
          text = text.replace('const language = this._hass?.locale?.language || this._hass?.language || "en";', 'const language = window.__ESHTAYA_SMART_LANG__ || this._hass?.locale?.language || this._hass?.language || "en";')
          entity_panel.write_text(text, encoding="utf-8")

          entity_loader = root / "frontend/entity/eshtaya-entity-manager-panel-loader.js"
          text = entity_loader.read_text(encoding="utf-8")
          text = text.replace('const DOMAIN = "eshtaya_entity_manager";', 'const DOMAIN = "eshtaya_smart_control/entity";')
          entity_loader.write_text(text, encoding="utf-8")
          PY

      - name: Apply Eshtaya Smart Control overlay
        shell: bash
        run: |
          set -euo pipefail
          cat \
            overlay2.part_000 \
            overlay2.part_001 \
            source_payload.part_002 \
            overlay2.part_003 \
            source_payload.part_004 \
            source_payload.part_006 \
            overlay2.part_006 \
            source_payload.part_007 \
            | base64 --decode > "$RUNNER_TEMP/eshtaya-smart-control-overlay.tar.gz"
          tar -xzf "$RUNNER_TEMP/eshtaya-smart-control-overlay.tar.gz" -C .
          rm -f source_payload.part_* overlay2.part_* source_payload.ready
          find . -type d -name '__pycache__' -prune -exec rm -rf {} +
          find . -type f -name '*.pyc' -delete

      - name: Validate source
        shell: bash
        run: |
          set -euo pipefail
          python -m compileall -q custom_components/eshtaya_smart_control
          node --check custom_components/eshtaya_smart_control/frontend/smart-control-panel.js
          node --check custom_components/eshtaya_smart_control/frontend/tuya-control.js
          node --check custom_components/eshtaya_smart_control/frontend/entity/eshtaya-entity-manager-panel.js
          node --check custom_components/eshtaya_smart_control/frontend/entity/eshtaya-entity-manager-panel-loader.js
          node --check custom_components/eshtaya_smart_control/frontend/multiway/panel.js
          python - <<'PY'
          import json
          from pathlib import Path
          for path in Path('custom_components/eshtaya_smart_control').rglob('*.json'):
              json.loads(path.read_text(encoding='utf-8'))
          PY
          find . -type d -name '__pycache__' -prune -exec rm -rf {} +
          find . -type f -name '*.pyc' -delete

      - name: Commit imported source
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/bootstrap-import.yml manual-trigger
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Initial release: Eshtaya Smart Control v1.0.0"
          BRANCH="${GITHUB_HEAD_REF:-main}"
          git push origin HEAD:"$BRANCH"
