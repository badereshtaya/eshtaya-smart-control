name: Validate
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hacs/action@main
        with:
          category: integration
  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Compile Python
        run: python -m compileall -q custom_components/eshtaya_smart_control
      - name: Validate JSON metadata and translations
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          for path in [
              Path("custom_components/eshtaya_smart_control/manifest.json"),
              Path("custom_components/eshtaya_smart_control/strings.json"),
              Path("custom_components/eshtaya_smart_control/translations/en.json"),
              Path("custom_components/eshtaya_smart_control/translations/ar.json"),
          ]:
              json.loads(path.read_text(encoding="utf-8"))
          PY
      - name: Verify v2.4.3 startup, migration, full-editor and UI safety invariants
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import runpy
          from pathlib import Path

          root = Path("custom_components/eshtaya_smart_control")
          manifest = json.loads((root / "manifest.json").read_text(encoding="utf-8"))
          if "tuya" not in manifest.get("after_dependencies", []):
              raise SystemExit("manifest must keep official Tuya as an after_dependency")
          if manifest.get("version") != "2.4.3":
              raise SystemExit(f"unexpected release version: {manifest.get('version')}")
          if manifest.get("documentation") != "https://github.com/badereshtaya/eshtaya-smart-control":
              raise SystemExit("manifest documentation URL must use the renamed repository")
          if manifest.get("issue_tracker") != "https://github.com/badereshtaya/eshtaya-smart-control/issues":
              raise SystemExit("manifest issue tracker URL must use the renamed repository")

          constants = runpy.run_path(str(root / "const.py"))
          if constants.get("VERSION") != manifest.get("version"):
              raise SystemExit("const.py VERSION and manifest version must match")
          defaults = constants.get("DEFAULT_OPTIONS")
          if not isinstance(defaults, dict):
              raise SystemExit("DEFAULT_OPTIONS is missing")
          required = {
              "startup_wait_home_assistant": True,
              "startup_wait_referenced_integrations": True,
              "legacy_migration_enabled": False,
              "legacy_hacs_cleanup": False,
              "legacy_service_aliases": False,
          }
          for key, expected in required.items():
              if defaults.get(key) is not expected:
                  raise SystemExit(f"unsafe default {key}={defaults.get(key)!r}; expected {expected!r}")

          startup = (root / "multiway" / "startup_safe_manager.py").read_text(encoding="utf-8")
          for required_text in (
              "EVENT_HOMEASSISTANT_STARTED",
              "_async_startup_barrier",
              "CONF_REPAIR_GRACE_SECONDS",
              "CONF_REPAIR_CONFIRMATIONS",
              "_clear_transient_missing_issues",
          ):
              if required_text not in startup:
                  raise SystemExit(f"startup safety invariant missing: {required_text}")

          panel = (root / "panel.py").read_text(encoding="utf-8")
          if "smart-control-panel-v243.js" not in panel:
              raise SystemExit("v2.4.3 frontend entrypoint is not loaded by panel.py")

          frontend_entry = (root / "frontend" / "smart-control-panel-v243.js").read_text(encoding="utf-8")
          if "template-manager-editor-v243.js" not in frontend_entry:
              raise SystemExit("v2.4.3 Template Manager editor extension is not loaded")

          editor_ui = (root / "frontend" / "template-manager-editor-v243.js").read_text(encoding="utf-8")
          for required_text in (
              "template/editor/get",
              "template/editor/save",
              "Advanced YAML",
              "definition_yaml",
              "unique_id",
              "Save all changes",
              "mutation_locked",
          ):
              if required_text not in editor_ui:
                  raise SystemExit(f"v2.4.3 editor UI invariant missing: {required_text}")

          hotfix = (root / "frontend" / "smart-control-panel-v241-hotfix.js").read_text(encoding="utf-8")
          for required_text in (
              "documentation/get",
              "[data-c]",
              "this._language === next",
              "selectionStart",
          ):
              if required_text not in hotfix:
                  raise SystemExit(f"v2.4.1 frontend invariant missing: {required_text}")

          generated = (root / "template_manager" / "generated_package.py").read_text(encoding="utf-8")
          for required_text in (
              "packages/eshtaya_generated_lights.yaml",
              "external_managed",
              "eshtaya_smart_control_backups",
              "template",
              "reload",
              ".esc-tmp",
          ):
              if required_text not in generated:
                  raise SystemExit(f"generated-package invariant missing: {required_text}")

          full_generated = (root / "template_manager" / "generated_package_v243.py").read_text(encoding="utf-8")
          for required_text in (
              "definition_yaml",
              "yaml.safe_load",
              "_move_type",
              "_set_unique_id",
              "async_restore",
              "previous_text",
          ):
              if required_text not in full_generated:
                  raise SystemExit(f"v2.4.3 generated-package editor invariant missing: {required_text}")

          manager = (root / "template_manager" / "manager_v242.py").read_text(encoding="utf-8")
          for required_text in (
              "FullTemplateEditorMixin",
              "GeneratedPackageManager",
              "external_managed",
              "generated_managed_count",
              "deferred",
              "prepared",
              "restart_required",
              "stale_state",
          ):
              if required_text not in manager:
                  raise SystemExit(f"Template Manager activation invariant missing: {required_text}")

          editor = (root / "template_manager" / "editor_v243.py").read_text(encoding="utf-8")
          for required_text in (
              "async_editor_get",
              "async_editor_save",
              "async_get_entity_id",
              "definition_yaml",
              "async_restore",
              "SIGNAL_TEMPLATE_CHANGED",
          ):
              if required_text not in editor:
                  raise SystemExit(f"v2.4.3 editor backend invariant missing: {required_text}")

          template_ws = (root / "template_manager" / "websocket.py").read_text(encoding="utf-8")
          for required_text in (
              "template/editor/get",
              "template/editor/save",
              "websocket_editor_get",
              "websocket_editor_save",
              "template.manage",
          ):
              if required_text not in template_ws:
                  raise SystemExit(f"v2.4.3 Template Manager WebSocket invariant missing: {required_text}")

          settings = (root / "settings.py").read_text(encoding="utf-8")
          for required_text in (
              "settings/get",
              "settings/update",
              "legacy_migration_enabled",
              "migrate_legacy_entity_manager",
              "migrate_legacy_multiway",
              "migrate_legacy_template_manager",
              "legacy_hacs_cleanup",
              "legacy_service_aliases",
              "startup_wait_home_assistant",
              "startup_wait_referenced_integrations",
          ):
              if required_text not in settings:
                  raise SystemExit(f"runtime settings invariant missing: {required_text}")

          root_init = (root / "__init__.py").read_text(encoding="utf-8")
          for required_text in ("manager_v242", "async_register_settings_ws"):
              if required_text not in root_init:
                  raise SystemExit(f"activation invariant missing: {required_text}")
          if "add_update_listener(_entry_updated)" in root_init:
              raise SystemExit("deprecated options reload listener must not return")

          runtime_ui = (root / "frontend" / "runtime-settings-panel.js").read_text(encoding="utf-8")
          for required_text in (
              "Legacy migration controls",
              "legacy_migration_enabled",
              "settings/update",
              "generated YAML packages are managed automatically",
          ):
              if required_text not in runtime_ui:
                  raise SystemExit(f"runtime settings UI invariant missing: {required_text}")

          websocket = (root / "websocket_v22.py").read_text(encoding="utf-8")
          for required_text in ("documentation/get", "websocket_documentation_get", "docs.view"):
              if required_text not in websocket:
                  raise SystemExit(f"permission-aware documentation WebSocket invariant missing: {required_text}")
          PY
      - name: Verify packaged documentation is byte-identical to GitHub docs
        shell: bash
        run: |
          set -euo pipefail
          diff -ru docs/ar custom_components/eshtaya_smart_control/docs/ar
          diff -ru docs/en custom_components/eshtaya_smart_control/docs/en
      - name: Verify documentation loader can see all guides
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import runpy
          from pathlib import Path

          expected_files = {
              "GETTING_STARTED", "DASHBOARD", "ENTITY_CONTROL", "TUYA_CONTROL",
              "MULTIWAY", "SMART_GROUPS", "COMMISSIONING", "SYSTEM_CENTER",
              "ACCESS_CONTROL", "MIGRATION", "ARCHITECTURE", "SECURITY_AND_BACKUP",
              "TROUBLESHOOTING", "TEMPLATE_MANAGER",
          }
          expected_slugs = (expected_files - {"SECURITY_AND_BACKUP"}) | {"SECURITY_BACKUP"}
          root = Path("custom_components/eshtaya_smart_control")
          for language in ("ar", "en"):
              found = {p.stem for p in (root / "docs" / language).glob("*.md")}
              missing = sorted(expected_files - found)
              extra = sorted(found - expected_files)
              if missing or extra:
                  raise SystemExit(f"{language}: missing={missing} extra={extra}")

          loaded = runpy.run_path(str(root / "documentation_v23.py"))["DOCUMENTATION"]
          for language in ("ar", "en"):
              found = set(loaded.get(language, {}))
              if found != expected_slugs:
                  raise SystemExit(f"{language}: loader slugs mismatch: {sorted(found)}")
              empty = [slug for slug, text in loaded[language].items() if not str(text).strip()]
              if empty:
                  raise SystemExit(f"{language}: empty documentation pages: {empty}")
          PY
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: |
          find custom_components/eshtaya_smart_control/frontend -name '*.js' -print0 | xargs -0 -n1 node --check
  package:
    needs: [hacs, hassfest, syntax]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build verified source archive
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(python -c 'import json; print(json.load(open("custom_components/eshtaya_smart_control/manifest.json"))["version"])')"
          ARCHIVE="eshtaya-smart-control-v${VERSION}.zip"
          zip -r "$ARCHIVE" \
            custom_components \
            docs \
            README.md \
            CHANGELOG.md \
            SECURITY.md \
            LICENSE \
            hacs.json \
            pyproject.toml \
            -x '**/__pycache__/**' '*.pyc'
          echo "archive=$ARCHIVE" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v4
        with:
          name: eshtaya-smart-control-verified
          path: ${{ env.archive }}
          if-no-files-found: error
          retention-days: 14
